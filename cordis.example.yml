# 在本文件中把 YOUR_GITHUB_USERNAME 换成你的 GitHub 用户名(npm 安装方式),
# 或把 name 换成插件源码的绝对路径(git clone 安装方式)。
# 将本文件作为 --patch 叠加层启动,或把两段内容并入你的 profile patch:
#   pnpm dsh web --patch ./cordis.example.yml
- insert:
    - id: tailscale-gateway
      # git/npm 安装后用包名:
      name: 'dsh-tailscale-gateway'
      # 本地源码安装则改用绝对路径,例如:
      # name: 'D:/path/to/dsh-tailscale-gateway/src/index.ts'
      config:
        listenPort: 3080

# 重述 connection 行(patch 会整体替换该行 config),放行探测到的权威并延长 Cookie 有效期。
- id: connection
  inject: [ webStartup, tailscaleGateway ]
  config:
    trustedHosts: !!js "[...ctx.tailscaleGateway.trustedHosts, ...ctx.webStartup.trustedHosts]"
    cookieMaxAgeDays: 3650
