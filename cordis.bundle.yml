# dsh-tailscale-gateway 组合包 patch:随插件安装自动应用,卸载自动移除。
# 插入转发器插件行,并重述 connection 行(patch 会整体替换该行 config)以
# 放行探测到的 Tailscale 权威、延长 Cookie 有效期。
- insert:
    - id: tailscale-gateway
      name: 'dsh-tailscale-gateway'
      config:
        listenPort: 3080
        # 每个请求自动注入有效 Cookie;设为 false 可恢复 DSH 自带的令牌+Cookie 认证
        autoAuth: true
- id: connection
  inject: [ webStartup, tailscaleGateway ]
  config:
    trustedHosts: !!js "[...ctx.tailscaleGateway.trustedHosts, ...ctx.webStartup.trustedHosts]"
    # 浏览器普遍把 Cookie 寿命上限设为 400 天;10 年会被拒收/截断
    cookieMaxAgeDays: 365
